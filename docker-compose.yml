# =============================================================================
# SPMT System - Production Docker & Docker Compose Setup
# =============================================================================

# --- Dockerfile (Backend Service) ---
# Save as: Dockerfile
"""
FROM node:20-alpine AS builder
WORKDIR /app
COPY package*.json ./
RUN npm ci
COPY . .
RUN npm run build

FROM node:20-alpine AS runner
WORKDIR /app
ENV NODE_ENV=production
COPY package*.json ./
RUN npm ci --only=production
COPY --from=builder /app/dist ./dist
EXPOSE 3000
CMD ["node", "dist/server.js"]
"""

# --- docker-compose.yml ---
# Save as: docker-compose.yml
version: '3.8'

services:
  # 1. PostgreSQL Database Service
  postgres-db:
    image: postgres:15-alpine
    container_name: spmt-postgres
    restart: always
    environment:
      POSTGRES_DB: spmt_db
      POSTGRES_USER: spmt_admin
      POSTGRES_PASSWORD: SecretPassword123!
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./spmt_schema.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U spmt_admin -d spmt_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 2. Redis Cache & Queue Service
  redis-cache:
    image: redis:7-alpine
    container_name: spmt-redis
    restart: always
    ports:
      - "6379:6379"

  # 3. Backend REST API Service
  backend-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: spmt-backend
    restart: always
    ports:
      - "3000:3000"
    environment:
      PORT: 3000
      DATABASE_URL: "postgresql://spmt_admin:SecretPassword123!@postgres-db:5432/spmt_db?schema=public"
      REDIS_URL: "redis://redis-cache:6379"
      INT_API_ENDPOINT: "https://int.system.local/api/v1"
      BMT_API_ENDPOINT: "https://bmt.system.local/api/v1"
    depends_on:
      postgres-db:
        condition: service_healthy
      redis-cache:
        condition: service_started

  # 4. Web Frontend Service (Nginx)
  web-frontend:
    image: nginx:alpine
    container_name: spmt-web
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./index.html:/usr/share/nginx/html/index.html
    depends_on:
      - backend-api

volumes:
  postgres_data:
