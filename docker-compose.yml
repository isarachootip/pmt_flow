version: '3.8'

services:
  # 1. PostgreSQL Database Service
  postgres-db:
    image: postgres:15-alpine
    container_name: spmt-postgres
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-spmt_db}
      POSTGRES_USER: ${POSTGRES_USER:-spmt_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-SecretPassword123!}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./schema.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U spmt_admin -d spmt_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 2. Redis Cache & Queue Service
  redis-cache:
    image: redis:7-alpine
    container_name: spmt-redis
    restart: always
    ports:
      - "6379:6379"

  # 3. Backend REST API Service
  backend-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: spmt-backend
    restart: always
    ports:
      - "3000:3000"
    environment:
      PORT: 3000
      DATABASE_URL: "postgresql://spmt_admin:SecretPassword123!@postgres-db:5432/spmt_db?schema=public"
      REDIS_URL: "redis://redis-cache:6379"
      INT_API_ENDPOINT: "https://int.system.local/api/v1"
      BMT_API_ENDPOINT: "https://bmt.system.local/api/v1"
    depends_on:
      postgres-db:
        condition: service_healthy
      redis-cache:
        condition: service_started

volumes:
  postgres_data:
